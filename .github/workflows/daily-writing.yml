name: Daily writing lesson
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-writing-lesson
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and validate the daily lesson
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: node scripts/generate-daily.mjs
      - name: Save lesson in the public lesson database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lessons.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish daily writing lesson"
          git pull --rebase origin main
          git push origin HEAD:main
